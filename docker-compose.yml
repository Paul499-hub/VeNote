
services:
  backend:
    build: .
    container_name: vn-backend
    command: python3 -m app.main
    runtime: nvidia
    env_file:
      - .env
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    ports:
        - "127.0.0.1:48721:8000"
    depends_on:
      - qdrant
    volumes:
      - ./app:/app/app
      - hf_cache:/root/.cache/huggingface

  qdrant:
    image: qdrant/qdrant:latest
    container_name: vn-qdrant
    ports:
      - "127.0.0.1:48722:6333" # JSON HTTP
      - "127.0.0.1:48723:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
  hf_cache: