
version: "3.9"

services:
  backend:
    build: .
    container_name: vn-backend
    command: .venv/bin/python app/main.py
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
